name: Build Release Artifacts

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: windows-zip
            binary_artifact_name: windows-binary
            archive_file: ZomboidControlPanel-windows.zip
            archive_path: ZomboidControlPanel-windows.zip
            binary_file: ZomboidControlPanel.exe
            build_arg: --windows
          - os: ubuntu-22.04
            artifact_name: linux-tarball
            binary_artifact_name: linux-binary
            archive_file: ZomboidControlPanel-linux.tar.gz
            archive_path: release/ZomboidControlPanel-linux.tar.gz
            binary_file: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node scripts/release/build.mjs ${{ matrix.build_arg }}

      - name: Smoke-test packaged release
        run: node scripts/smoke-release.mjs

      - name: Verify release version parity
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Verify Linux ABI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=$(grep -aohE 'GLIBC_[0-9.]+' release/ZomboidControlPanel | sort -Vu | tail -1)
          if [ -z "$max_glibc" ]; then
            echo "Could not determine the Linux binary glibc requirement" >&2
            exit 1
          fi
          highest=$(printf '%s\n' 'GLIBC_2.28' "$max_glibc" | sort -V | tail -1)
          if [ "$highest" != 'GLIBC_2.28' ]; then
            echo "Linux binary requires $max_glibc; maximum supported requirement is GLIBC_2.28" >&2
            exit 1
          fi
          echo "Linux binary glibc requirement: $max_glibc"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: release/${{ matrix.binary_file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - build
      - acceptance
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-tarball
          path: .

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-binary
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-binary
          path: .

      - name: Generate checksums
        run: |
          sha256sum \
            ZomboidControlPanel.exe \
            ZomboidControlPanel \
            ZomboidControlPanel-windows.zip \
            ZomboidControlPanel-linux.tar.gz \
            docker-compose.install.yml \
            Dockerfile > checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading assets."
            if [[ "$release_tag" == *-* ]]; then
              gh release edit "$release_tag" \
                --repo "${GITHUB_REPOSITORY}" \
                --prerelease
            fi
          else
            release_args=(
              --repo "${GITHUB_REPOSITORY}"
              --title "Release $release_tag"
              --generate-notes
            )
            if [[ "$release_tag" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$release_tag" "${release_args[@]}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ZomboidControlPanel.exe \
              ZomboidControlPanel \
              ZomboidControlPanel-windows.zip \
              ZomboidControlPanel-linux.tar.gz \
              docker-compose.install.yml \
              Dockerfile \
              checksums.txt; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          exit 1

  acceptance:
    needs: build
    uses: ./.github/workflows/real-acceptance.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
