name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:server

      - name: Typecheck
        run: pnpm --filter @better-zcp/panel-server run typecheck

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if pnpm run test:server 2>&1 | tee /tmp/server-test-output.log; then
            exit 0
          fi
          if grep -q 'EnvironmentTeardownError' /tmp/server-test-output.log && \
             ! grep -q 'Failed Tests' /tmp/server-test-output.log; then
            echo "::warning::vitest-worker-teardown-flake-exits-1 (known upstream race, 0 real test failures) -- retrying once"
            pnpm run test:server
          else
            exit 1
          fi

  engine-signatures:
    name: Engine signature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Engine signature check
        run: node scripts/check-engine-signatures.mjs

  scripts-checkers:
    name: Scripts checkers (bridge actions/routes, RCON commands, i18n duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Bridge actions audit (Events.tsx/api.ts -> Lua handlers)
        run: node scripts/audit-bridge-actions.mjs .

      - name: Bridge routes audit (panelBridge.js routes -> Lua handlers)
        run: node scripts/audit-bridge-routes.mjs .

      - name: RCON commands (panel-side denominator only)
        run: node scripts/audit-rcon-commands.mjs .

      - name: i18n French duplicate-value check (against the reviewed baseline)
        run: node scripts/i18n-check.mjs --all

  client:
    name: Client (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install
        run: pnpm install --filter @better-zcp/panel-client --filter @better-zcp/panel-server --frozen-lockfile

      - name: Lint
        working-directory: apps/panel-client
        run: pnpm run lint

      - name: Typecheck
        working-directory: apps/panel-client
        run: pnpm run typecheck

      - name: Production build
        working-directory: apps/panel-client
        run: pnpm run build

      - name: Check browser/server dependency boundary
        run: pnpm run check:client-boundary

      - name: Tests
        working-directory: apps/panel-client
        run: pnpm run test

  windows-packaged-updater:
    name: Windows packaged updater
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile

      - name: Exercise bundle transaction and generated supervisor
        run: pnpm --filter @better-zcp/panel-server exec vitest run tests/panelUpdateBundle.test.ts tests/supervisor-restart.test.ts tests/serverManagerSpacedPathCmdQuoting.test.ts tests/serverManagerWindowsSpawnFixes.test.ts tests/serverManagerCustomStartCommandQuoting.test.ts tests/serverManagerCommandLineRoundTrip.test.ts tests/serverManagerEmptyScanWindows.test.ts tests/serverManager-stopTimeout.test.ts tests/setDataPaths.test.ts

      - name: Preload pkg Windows base binary
        shell: pwsh
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}\pkg-cache
        run: |
          $cacheDir = Join-Path $env:PKG_CACHE_PATH "v3.6"
          $binaryPath = Join-Path $cacheDir "fetched-v22.23.2-win-x64"
          $downloadPath = "$binaryPath.download"
          $url = "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-win-x64"
          $expectedSha256 = "555d3dceaaf1c5628ac8fa23d1ebde46a424d2ad6782cc2412be8eed4a7a6b69"

          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              curl.exe --fail --location --retry 3 --retry-delay 2 --output $downloadPath $url
              if ($LASTEXITCODE -ne 0) { throw "curl exited with code $LASTEXITCODE" }

              $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadPath).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256) {
                throw "pkg binary checksum mismatch: expected $expectedSha256, got $actualSha256"
              }

              Move-Item -Force $downloadPath $binaryPath
              break
            } catch {
              if (Test-Path -LiteralPath $downloadPath) { Remove-Item -Force $downloadPath }
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 3
            }
          }

          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "pkg Windows base binary was not cached"
          }

      - name: Build packaged Windows executable
        env:
          PKG_CACHE_PATH: ${{ runner.temp }}\pkg-cache
        run: node scripts/release/build.mjs --windows

      - name: Smoke-test packaged Windows release
        run: node scripts/smoke-release.mjs

      - name: Install Chromium for packaged auth smoke
        run: pnpm exec playwright install chromium

      - name: Smoke-test packaged auth persistence
        env:
          RUN_AUTH_SMOKE: "1"
        run: node scripts/smoke-release.mjs

      - name: Verify packaged updater artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path release\ZomboidControlPanel.exe)) { throw "Packaged executable is missing" }
          if (-not (Test-Path release\Start.bat)) { throw "Generated supervisor is missing" }
          $buildInfo = Get-Content release\client\dist\build-info.json -Raw | ConvertFrom-Json
          $manifest = Get-Content release\release-manifest.json -Raw | ConvertFrom-Json
          if ($buildInfo.panelVersion -ne $manifest.version) { throw "Frontend/backend version mismatch" }
          if ($buildInfo.buildSha -ne $manifest.buildSha) { throw "Frontend/backend build SHA mismatch" }
          if ($buildInfo.apiContractVersion -ne $manifest.apiContractVersion) { throw "Frontend/backend API contract mismatch" }
