services:
  panel:
    image: ghcr.io/itsmeares/better-zcp:latest
    pull_policy: always
    container_name: zomboid-panel
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - panel-data:/app/data
      - panel-logs:/app/logs

volumes:
  panel-data:
  panel-logs:
